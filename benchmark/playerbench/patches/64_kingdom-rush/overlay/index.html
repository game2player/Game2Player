<!doctype html>
<html lang="en" data-game-id="64_kingdom-rush">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kingdom Rush — local Ruffle build</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#05070b;
      color:#e5e7eb; font:13px/1.2 system-ui,sans-serif; }
    #bar { height:34px; display:flex; align-items:center; gap:10px; padding:0 10px;
      background:#111827; border-bottom:1px solid #334155; }
    #bar strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #bar span { color:#94a3b8; flex:1; }
    #bar a { color:#bfdbfe; text-decoration:none; }
    #stage { width:100%; height:calc(100% - 34px); display:flex; align-items:center;
      justify-content:center; background:#000; }
    ruffle-player { display:block; width:min(100%, 700px); height:min(100%, 600px);
      max-width:100%; max-height:100%; aspect-ratio:700/600; }
  </style>
  <script src="game_api.js"></script>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden",
      splashScreen: false,
      letterbox: "on",
      warnOnUnsupportedContent: false,
      contextMenu: "off"
    };
    window.addEventListener("DOMContentLoaded", function () {
      var ruffle = window.RufflePlayer.newest();
      var player = ruffle.createPlayer();
      player.id = "game-player";
      document.getElementById("stage").appendChild(player);
      player.ruffle().load({
        url: "game.swf",
        allowScriptAccess: true,
        autoplay: "on",
        unmuteOverlay: "hidden",
        splashScreen: false,
        letterbox: "on",
        contextMenu: "off"
      }).catch(function (error) {
        document.getElementById("status").textContent = "Ruffle load failed: " + error;
      });
    });
  </script>
  <script src="ruffle/ruffle.js"></script>
</head>
<body>
  <div id="bar">
    <strong>Kingdom Rush</strong>
    <span id="status">Local SWF via Ruffle</span>
  </div>
  <main id="stage"></main>
</body>
</html>
