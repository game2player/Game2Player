<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offroaders 2</title>
  <style>
    html,body,#stage { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
    ruffle-player { display:block; width:100%; height:100%; }
    #loading { position:absolute; inset:0; display:grid; place-items:center; background:#000;
      color:#eee; font:20px Arial,sans-serif; pointer-events:none; }
    [hidden] { display:none !important; }
  </style>
  <script>
    window.RufflePlayer = {config:{autoplay:"on",unmuteOverlay:"hidden",splashScreen:false,
      contextMenu:"off",allowScriptAccess:true,letterbox:"on",logLevel:"error"}};
  </script>
  <script src="ruffle/ruffle.js"></script>
  <script src="game_api.js"></script>
</head>
<body>
  <main id="stage"></main>
  <div id="loading">Loading Offroaders 2…</div>
</body>
</html>
