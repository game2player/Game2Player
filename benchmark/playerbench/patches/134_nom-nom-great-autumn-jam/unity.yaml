schema_version: 1
game_id: 134_nom-nom-great-autumn-jam

# Il2CppDumper cannot auto-locate this build's registrations (metadata v29), so the
# TypeInfo slots below were found by scanning the static data segment for the class
# pointers of DayManager and JamBlackboard; field offsets were read from the live
# Il2CppClass field tables. games/benchmark/134_nom-nom-great-autumn-jam/game_api.js
# derives the task metrics from these roots.
runtime:
  pointer_size: 4
  class_static_fields_offset: 92
  allow_method_calls: false

state:
  fields:
    game_state.internal.day_manager:
      kind: memory
      type: ptr
      address:
        kind: chain
        base: &day_manager_static
          kind: static_fields
          type_info: 3983976
        steps:
          - offset: 0
    game_state.internal.is_day:
      kind: memory
      type: bool
      address:
        kind: chain
        base: *day_manager_static
        steps:
          - offset: 0
            dereference: true
          - offset: 92
    game_state.internal.day_time_s:
      kind: memory
      type: f32
      address:
        kind: chain
        base: *day_manager_static
        steps:
          - offset: 0
            dereference: true
          - offset: 88
    game_state.internal.day_duration_s:
      kind: memory
      type: f32
      address:
        kind: chain
        base: *day_manager_static
        steps:
          - offset: 0
            dereference: true
          - offset: 76
    game_state.internal.lost:
      kind: memory
      type: bool
      address:
        kind: chain
        base: *day_manager_static
        steps:
          - offset: 0
            dereference: true
          - offset: 100
    game_state.internal.blackboard:
      kind: memory
      type: ptr
      address:
        kind: chain
        base:
          kind: static_fields
          type_info: 3983948
        steps:
          - offset: 0
  status:
    field: game_state.internal.is_day
    mapping:
      "true": playing
      "false": playing
    default: loading
  actionable_statuses:
    - playing
  terminal:
    rules:
      - when:
          field: game_state.internal.lost
          equals: true
        outcome: fail
        reason: three_bad_days

actions:
