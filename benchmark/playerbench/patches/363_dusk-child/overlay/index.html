<!doctype html>
<html data-game-id="363_dusk-child" data-source-url="https://sophieh.itch.io/dusk-child">
<head>
<meta charset="utf-8">
<title>Dusk Child</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas#canvas {
    position: absolute; inset: 0; margin: auto;
    width: min(100vw, 100vh) !important; height: min(100vw, 100vh) !important;
    image-rendering: pixelated; outline: none; display: block;
  }
</style>
</head>
<body>
<canvas class="emscripten" id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<script>
  // PICO-8 0.1.10B player (official export, itch hotlink wrapper and shell buttons removed).
  // pico8_gpio is the cart's GPIO bank (0x5f80..0x5fff) shared with game_api.js.
  var canvas = document.getElementById("canvas");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var pico8_gpio = new Array(128);
  for (var gi = 0; gi < 128; gi++) pico8_gpio[gi] = 0;
  var Module = {};
  Module.canvas = canvas;
  // keep arrow keys and space from scrolling the page
  document.addEventListener("keydown", function (e) {
    if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) e.preventDefault();
  }, false);
</script>
<script src="game_api.js"></script>
<script async src="dc14.js"></script>
</body>
</html>
