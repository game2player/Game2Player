<!doctype html>
<html lang="en" data-game-id="125_shift-2">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SHIFT 2 — local Ruffle build</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
    #stage { width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#000; }
    ruffle-player { display:block; width:100%; height:100%; }
  </style>
  <script src="game_api.js"></script>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden",
      splashScreen: false,
      letterbox: "on",
      warnOnUnsupportedContent: false,
      contextMenu: "off"
    };
    window.addEventListener("DOMContentLoaded", function () {
      // The SWF reads `level=` out of its own movie URL at its title frame and
      // enters that chamber directly, so pass the task query through.
      var ruffle = window.RufflePlayer.newest();
      var player = ruffle.createPlayer();
      player.id = "game-player";
      document.getElementById("stage").appendChild(player);

      // Ruffle delivers keyboard input only while its element carries focus, and it
      // only learns that from a focus event arriving after it has booted. The
      // browser can hold focus from before that, so re-deliver the event with a
      // blur/focus cycle rather than a plain focus().
      function ensureFocus() {
        try {
          if (typeof player.focus !== "function") return;
          if (document.activeElement === player && typeof player.blur === "function") {
            player.blur();
          }
          player.focus();
        } catch (err) {}
      }
      window.addEventListener("focus", ensureFocus);
      document.addEventListener("visibilitychange", ensureFocus);
      document.addEventListener("pointerup", ensureFocus);
      [0, 100, 300, 1000, 2000].forEach(function (delay) {
        setTimeout(ensureFocus, delay);
      });

      player.ruffle().load({
        url: "game.swf" + (window.location.search || ""),
        allowScriptAccess: true,
        autoplay: "on",
        unmuteOverlay: "hidden",
        splashScreen: false,
        letterbox: "on",
        contextMenu: "off"
      }).then(ensureFocus).catch(function (error) {
        document.title = "Ruffle load failed: " + error;
      });
    });
  </script>
  <script src="ruffle/ruffle.js"></script>
</head>
<body>
  <main id="stage"></main>
</body>
</html>
