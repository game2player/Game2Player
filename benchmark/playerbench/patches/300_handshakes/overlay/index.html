<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handshakes</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fecc80; }
    #unity-canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" width="1200" height="800" tabindex="0" aria-label="Handshakes"></canvas>
  <script src="game_api.js"></script>
  <script src="Build/WebGL.loader.js"></script>
  <script>
    createUnityInstance(document.getElementById("unity-canvas"), {
      dataUrl: "Build/WebGL.data",
      frameworkUrl: "Build/WebGL.framework.js",
      codeUrl: "Build/WebGL.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Pet Pumpkin, Damaskino, Trumpetguy",
      productName: "Handshakes",
      productVersion: "1.1.3"
    }).then(instance => {
      window.unityInstance = instance;
      document.getElementById("unity-canvas").focus();
      if (window.gameAPI) window.gameAPI.init();
    });
  </script>
</body>
</html>
