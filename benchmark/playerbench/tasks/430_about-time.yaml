game:
  game_name: 430_about-time
  url: https://ameblohsh.itch.io/about-time
  speed_multiplier: 1.0
  width: 1280
  height: 720
  game_rules: 'About Time! is a clock-building roguelike. In each shift, the two hands land

    on clock numbers and multiply their values into the shift score. Gear abilities

    can change those results. Reach the displayed Minimum Score before your forwards

    run out; a clear pays cash and raises the next shift''s target, while falling short

    ends the run. Gear bought in the shop fills up to five slots. A paper box costs

    $6 and opens clock editing, where papers can change a selected number.


    Task links enter either the Tutorial''s opening dialogue or a fresh standard run

    at Round 1. The tutorial''s opening callouts explain how to begin forwarding time.

    '
  game_roles:
  - name: player
    context:
      role_description: 'You control the clock run: spend forwards to build score, then use shift

        payouts to buy gears or papers that change later results.

        '
      control_notes: "- In the opening Tutorial, press Space while dialogue or a callout is\n  visible.\
        \ It speeds text while it is appearing; press Space again after\n  the text finishes to advance.\
        \ The final opening callout closes and enables\n  Forward Time.\n- In a shift, left-click Forward\
        \ Time once to spend one forward. The clock\n  hands and score animate afterward; wait until the\
        \ hands stop and the Round\n  Score finishes rolling before clicking again. The button stays visible\n\
        \  while disabled during this animation, so rapid taps are ignored. Watch the\n  accumulated score,\
        \ Minimum Score target, and remaining forwards at the\n  sides of the clock. Reach the target\
        \ before using the last forward.\n- After a clear, left-click Finish shift on the payout panel\
        \ to collect the\n  cash and open the shop. Wait until the shop finishes sliding into place\n\
        \  before clicking inside it. Click a gear or paper box to unfold its price\n  tag; wait until\
        \ the full tag is visible, then click the tag to buy it. A\n  bought gear appears in an empty\
        \ slot on the right. Click Play to return\n  to the clock.\n- The paper box costs $6. Buying it\
        \ opens Clock Changing. Wait until that\n  panel finishes sliding into place, then click a clock\
        \ number to select it\n  and click a paper. Wait until the paper's Use control unfolds, then click\n\
        \  Use to apply it. Cash-only papers add money and do not change a clock\n  number.\n"
    controls:
      allowed_keys:
      - Space
      - Enter
      allow_clicks: true
      hold_duration: 0.05
tasks:
- task_id: '430_01'
  game_id: 430_about-time
  game_url_suffix: ?task=430_01
  evaluator_id: game_api_metric
  difficulty: easy
  task_start_score_field: 0
  task_target_score_field: 8
  pause_during_inference: false
  continue_on_fail: false
  task_prompt: 'Complete the Tutorial''s opening dialogue and its four clock callouts. Press

    Press Space to speed the visible text, then press Space again after it has

    finished to advance. Stop when the final callout closes and Forward Time is

    enabled for the first shift.

    '
  progress_signal:
    field: game_state.tutorial_progress
    granularity: counter
    coarse_reason: The source exposes three dialogue beats and four callouts as the seven opening tutorial
      milestones; animated text reveal is presentation rather than another tutorial milestone.
    provenance: engine_hook
  evaluator_config:
    terminal_status: success
    score_field: game_state.tutorial_progress
    end_field: terminal.isTerminal
    metrics_fields:
    - game_state.task_id
    - game_state.mode
    - game_state.task_start_ready
    - game_state.task_start_matches
    - game_state.tutorial_progress
    - game_state.tutorial_completion_progress
    - game_state.forward_time_enabled
    - game_state.task_success
    - terminal.outcome
    - terminal.isTerminal
