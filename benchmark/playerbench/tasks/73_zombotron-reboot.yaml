game:
  game_name: 73_zombotron-reboot
  speed_multiplier: 1.0
  width: 1280
  height: 720
  url: https://antkarlov.itch.io/zombotron-reboot
  game_rules: "Zombotron Re-Boot is a side-scrolling run-and-gun shooter. Stage 1 is already\nin progress\
    \ when the environment loads; there is no title screen or menu to\nget past.\n\n## Game Objective\n\
    - Fight through the opening stage, use elevators to move between floors, and\n  reach the exit alive.\n\
    - The stage also hides one secret place off the main path; some sparkle.\n\n## Game Rules\n- You start\
    \ with a pistol, three hearts of health, and no money.\n- Enemies shoot back and grab at close range.\
    \ Every hit costs a heart; at zero\n  hearts the run is over and the stage restarts from the beginning.\n\
    - Killing enemies and looting money, dropped weapons and the hidden secret are\n  optional side goals;\
    \ the exit is what ends the stage.\n- The level is wider and taller than one screen: lower and upper\
    \ floors are\n  joined by elevators.\n"
  game_roles:
  - name: player
    context:
      role_description: 'You control the soldier in stage 1: move, jump, aim and shoot your way

        through the level. Do not open the pause menu.

        '
      control_notes: '- A/D or left/right: walk

        - Space: jump

        - Mouse move: aim; left click: fire the equipped weapon

        - R: reload

        - E: interact - elevators, switches, pickups, and the exit

        - Do not press Escape; it opens the pause menu and stops the game

        - Waiting is meaningful while shots, jumps or enemies resolve

        '
    controls:
      allowed_keys:
      - w
      - a
      - s
      - d
      - Space
      - e
      - r
      allow_clicks: true
      hold_duration: 0.35
tasks:
