game:
  game_name: 367_10-103
  url: https://nerdspartan.itch.io/10-103
  speed_multiplier: 1.0
  width: 960
  height: 600
  game_rules: "10-103 is a short side-scrolling horror shooter. You are a special-ops soldier\nsent down\
    \ through the floors of the Aegis containment facility. Each floor is\na dark corridor with a wall\
    \ label such as \"FLOOR 5\". You leave each floor in an\nelevator, which takes you to the next one\
    \ down. There is no menu and no save.\nEach task starts directly on a floor.\n\n- Elevators: an elevator\
    \ is a doorway with a lit up/down panel beside it. Stand\n  in the doorway and press Down to ride\
    \ it to the next floor. The way to the\n  exit is not always the obvious direction. Some floors make\
    \ you walk somewhere\n  else first: a dead elevator powers up, or a scripted event opens the way and\n\
    \  sends you back.\n- Radio: the operator talks over the radio, with subtitles near the bottom.\n\
    \  When \"Press TAB to report\" appears next to a walkie-talkie icon, the operator\n  is waiting for\
    \ your reply: tap Tab, after the current subtitle line has\n  finished, to answer and hear what comes\
    \ next. You can keep walking while the\n  prompt is up. Tab also reports unusual findings at any time.\n\
    - Enemies: zombies and soldier zombies wake as you approach and walk at you.\n  Each hit takes one\
    \ of your 3 health points.\n  Shoot them down; a zombie takes a few hits. Ghostly monsters cannot\
    \ be shot\n  until the story allows it, so the answer is usually to get away from them.\n- Death:\
    \ the screen turns fully red. A moment later, press Space to restart the\n  same floor from its beginning.\n\
    - Floor 11 ends with a radio call about a bomb: confirm it and then deal with\n  what comes for you.\
    \ After that the story moves to the last floor.\n"
  game_roles:
  - name: player
    context:
      role_description: 'You control the soldier in the corridor. Walk left and right, shoot the

        rifle in the direction you face, answer the radio, and take elevators down.

        '
      control_notes: "- ArrowLeft / ArrowRight: hold to walk that way and face it.\n- Space: fire the\
        \ rifle toward the way you face. A quick tap does not\n  fire: hold Space for about 0.3 s per\
        \ shot, or hold it longer to keep\n  firing. After a death, a tap of Space restarts the floor.\n\
        - Tab: answer the radio or report a finding. A tap is enough.\n- ArrowDown: ride the elevator\
        \ while standing in its doorway.\n- Waiting: radio transmissions play for several seconds. Answer\
        \ only once\n  the subtitle line has finished.\n"
    controls:
      allowed_keys:
      - ArrowLeft
      - ArrowRight
      - ArrowDown
      - Space
      - Tab
      allow_clicks: false
      hold_duration: 0.5
