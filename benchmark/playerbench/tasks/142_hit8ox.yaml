  task_prompt: Block 20 strikes from the HARD CPU on the City stage. Hold Z and X together to block, and
    keep the block up while the CPU punches or kicks you; each of its strikes that lands on your block
    counts. Strikes that hit you while you are not blocking do not count. If the fight ends before you
    have blocked 20 strikes, the attempt is over.
  progress_signal:
    field: metrics.blocked_attacks
    granularity: counter
    coarse_reason: Each blocked CPU strike is a single atomic defensive event in the game (it costs half
      the health of an unblocked hit); nothing finer exists, and 20 steps give the task resolution.
