game:
  game_name: 89_celeste-classic-2
  speed_multiplier: 1.0
  width: 1280
  height: 720
  url: https://maddymakesgamesinc.itch.io/celeste-classic-2
  game_rules: "You are playing Celeste Classic 2: Lani's Trek, a precision platformer.\n\n## Game Objective\n\
    - Climb the mountain from the first slope to the summit, one map at a time and\n  in order. A run\
    \ is eight maps long; there is no level select.\n- Red strawberries are optional, set off the main\
    \ climb. They are not needed to\n  finish a map.\n\n## Game Rules\n- The game opens straight onto\
    \ the first slope: no title screen, no card, no menu\n  and no level select. A run is all eight maps\
    \ in order.\n- Left and right arrow keys move; up and down do nothing. Z or C jumps, and hold\n  it\
    \ for a higher jump. X fires the grappling hook, which stays inert until you\n  take the hook lying\
    \ in the ravine (the second map); from the third map on it is\n  granted automatically.\n- Touch a\
    \ strawberry to carry it, then land on solid ground to keep it. A fruit\n  you are still carrying\
    \ when you die is lost.\n- Spikes and pits kill you; you respawn at the last flag you passed and the\
    \ run\n  continues. Maps with no flag restart from their beginning. The timer on screen\n  counts\
    \ in-game minutes and seconds.\n- Hook anchors are solid; ice is not. In the frozen caves, grab a\
    \ snowball or\n  catch a floating grapple orb instead.\n"
  game_roles:
  - name: climber
    context:
      role_description: 'You are Lani. Jump, grapple, climb, and collect strawberries.

        '
      control_notes: '- Left/Right arrows: move

        - Z or C: jump (hold for a higher jump)

        - X: fire the grappling hook (from the ravine onward)

        - Wait: let a jump, bounce, or respawn finish

        '
    controls:
      allowed_keys:
      - ArrowUp
      - ArrowDown
      - ArrowLeft
      - ArrowRight
      - z
      - x
      - c
      allow_clicks: false
      hold_duration: 0.2
tasks:
- task_id: '89_01'
  game_id: 89_celeste-classic-2
  difficulty: easy
  evaluator_id: game_api_metric
  task_target_score_field: 2
  task_start_score_field: 1
  pause_during_inference: true
  continue_on_fail: true
  task_prompt: 'The game opens straight onto the first slope of the mountain; there is no title

    or menu. Reach the ravine, the second map: run right, jump the gaps with Z or C,

    and drop through the collapsing bridge at the end of the slope. The grappling

    hook is not available yet. Spikes and pits return you to the start of the map

    and the run continues.

    '
  evaluator_config:
    terminal_status: fail
    score_field: metrics.route_progress
    end_field: terminal.isTerminal
