    - game_state.difficulty
    - game_state.tutorial_stage
    - game_state.inventory.stone
    - game_state.inventory.steel
    - game_state.wave
    - game_state.enemies
    - metrics.tutorial_completed_steps
    - terminal.outcome
    - terminal.isTerminal
