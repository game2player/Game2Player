<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Trajectory Recorder</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #11161c;
      color: #edf2f7;
      font: 14px system-ui, sans-serif;
    }
    main {
      max-width: 420px;
      padding: 28px;
      text-align: center;
    }
    h1 { margin: 0 0 10px; font-size: 22px; }
    button { display: none; }
    pre {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Preparing...</h1>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <pre id="status">idle</pre>
  </main>
  <script src="controller.js"></script>
</body>
</html>
