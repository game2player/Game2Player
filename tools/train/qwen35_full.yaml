# Game2Player-4B: full fine-tuning of the language model, with the vision encoder and
# aligner frozen. It ran on 8 GPUs of 80 GB: 2 packed sequences per GPU x 3 accumulation
# steps x 8 GPUs = 48 sequences of up to 25,000 tokens per optimizer step.
model: Qwen/Qwen3.5-4B
template: qwen3_5
use_hf: true
tuner_type: full
freeze_vit: true
freeze_aligner: true
torch_dtype: bfloat16
attn_impl: flash_attn
packing: true
lazy_tokenize: false
use_liger_kernel: true
deepspeed: zero2
gradient_checkpointing: true
per_device_train_batch_size: 2
gradient_accumulation_steps: 3
learning_rate: 0.00001
lr_scheduler_type: cosine
warmup_ratio: 0.03
num_train_epochs: 1
max_length: 25000
truncation_strategy: delete
split_dataset_ratio: 0
save_strategy: epoch
save_total_limit: 1
save_only_model: true
add_version: false
logging_steps: 1
dataloader_num_workers: 2
dataset_num_proc: 4
report_to: none
disable_ignore_empty_think: true
strict: true
seed: 3407
data_seed: 3407
